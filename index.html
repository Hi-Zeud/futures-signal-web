<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全市场信号中枢 (期货版)</title>
<style>
body { font-family: Arial; padding: 15px; background: #121212; color: #fff; margin: 0; }
h1 { color: #4CAF50; font-size: 22px; text-align: center; }
h2 { font-size: 18px; border-bottom: 2px solid #4CAF50; padding-bottom: 5px; color: #fff; margin-top: 0; }
h3 { font-size: 15px; color: #aaa; margin: 15px 0 5px 0; }
.signal { background: #2a2a2a; padding: 12px; margin: 6px 0; border-radius: 6px; border-left: 4px solid #4CAF50; font-size: 14px; }
.none { color: #666; font-size: 13px; font-style: italic; }
.time { color: #888; font-size: 12px; text-align: center; margin-bottom: 15px; }
button { display: block; margin: 0 auto 20px auto; background: #4CAF50; color: #fff; border: none; padding: 10px 30px; border-radius: 6px; font-size: 15px; cursor: pointer; }
.date { color: #888; font-size: 12px; margin-left: 10px; }
.sig { font-weight: bold; margin-left: 10px; }
.box { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
.info { font-size: 13px; color: #4CAF50; margin-bottom: 10px; }
.sub-box { background: #181818; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
.sub-title { font-size: 16px; color: #2196F3; font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed #444; padding-bottom: 5px; }
.desc { font-size: 12px; color: #888; margin-bottom: 10px; line-height: 1.5; background: #111; padding: 10px; border-radius: 5px; }
</style>
</head>
<body>
<h1>全市场信号中枢</h1>
<button onclick="location.reload()">手动刷新</button>

<div class="box">
    <h2>📈 期货信号区 (多周期)</h2>
    <p class="time" id="f-time">加载中...</p>
    <div class="info" id="f-scan-info">扫描期货品种: --</div>
    
    <div class="sub-box">
        <div class="sub-title">📅 日线信号 (全量)</div>
        <div class="desc">
            <b>出场规则</b>：最长持仓 10 根K线。<br>
            🔴 <b>极品回调 / 顺势单</b>：重仓(3ATR)。<br>
            ⚫ <b>强势突破 / 震荡缠绕</b>：放弃或避坑。
        </div>
        <div id="f-daily-today"></div>
        <h3>⏳ 近3日有效观察</h3>
        <div id="f-daily-past"></div>
    </div>

    <div class="sub-box">
        <div class="sub-title">📆 周线信号 (看大势)</div>
        <div class="desc">
            <b>出场规则</b>：最长持仓 8 根K线。<br>
            🔴 <b>震荡缠绕</b>：重仓(1ATR)。 🟢 <b>强势突破</b>：半仓(1ATR)。<br>
            ⚫ <b>极品回调 / 顺势单</b>：放弃。
        </div>
        <div id="f-weekly-today"></div>
        <h3>⏳ 近3日有效观察</h3>
        <div id="f-weekly-past"></div>
    </div>

    <div class="sub-box">
        <div class="sub-title">⏱️ 1小时信号 (快打)</div>
        <div class="desc">
            <b>出场规则</b>：最长持仓 10 根K线。<br>
            🟢 <b>强势突破</b>：半仓(2ATR)。<br>
            ⚫ 其他位置不推。
        </div>
        <div id="f-hourly-today"></div>
        <h3>⏳ 近3日有效观察</h3>
        <div id="f-hourly-past"></div>
    </div>
</div>

<script>
function renderList(elementId, list) {
    const el = document.getElementById(elementId);
    if (!list || list.length === 0) {
        el.innerHTML = '<p class="none">暂无信号</p>';
        return;
    }
    let html = "";
    list.forEach(item => {
        let color = "#4CAF50"; 
        if (item.sig_text.includes("做空") || item.sig_text.includes("观望") || item.sig_text.includes("放弃") || item.sig_text.includes("避坑")) {
            color = "#f44336"; 
        }
        
        html += `<div class="signal" style="border-left-color:${color}">
            <b>${item.name}</b> (${item.sym}) 
            <span class="date">${item.date}</span> 
            <span class="sig" style="color:${color}">${item.sig_text}</span>
        </div>`;
    });
    el.innerHTML = html;
}

function loadFutures() {
    fetch('futures_data.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
            document.getElementById('f-time').innerText = "更新时间: " + data.time;
            if (data.total_scanned) {
                document.getElementById('f-scan-info').innerText = "今日共扫描期货品种: " + data.total_scanned + " 只";
            }
            
            const dailyToday = data.today.filter(x => x.sig_text.includes("[日线]"));
            const weeklyToday = data.today.filter(x => x.sig_text.includes("[周线]"));
            const hourlyToday = data.today.filter(x => x.sig_text.includes("[1小时]"));

            const dailyPast = data.past.filter(x => x.sig_text.includes("[日线]"));
            const weeklyPast = data.past.filter(x => x.sig_text.includes("[周线]"));
            const hourlyPast = data.past.filter(x => x.sig_text.includes("[1小时]"));

            renderList('f-daily-today', dailyToday);
            renderList('f-daily-past', dailyPast);
            renderList('f-weekly-today', weeklyToday);
            renderList('f-weekly-past', weeklyPast);
            renderList('f-hourly-today', hourlyToday);
            renderList('f-hourly-past', hourlyPast);
        })
        .catch(e => {
            document.getElementById('f-time').innerText = "期货数据加载失败";
        });
}

loadFutures();
</script>
</body>
</html>
